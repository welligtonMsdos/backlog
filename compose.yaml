name: backlog
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_USER: backlog
      POSTGRES_DB: backlog
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Execute tools/init-env.ps1}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backlog -d backlog"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [internal]

  api:
    build:
      context: .
      target: api
      network: none
    image: backlog-api:local
    environment:
      ConnectionStrings__Database: Host=postgres;Database=backlog;Username=backlog;Password=${DB_PASSWORD}
      Jwt__Key: ${JWT_KEY:?Execute tools/init-env.ps1}
      Jwt__Issuer: backlog-api
      Jwt__Audience: backlog-client
      Bootstrap__Name: ${BOOTSTRAP_NAME}
      Bootstrap__Email: ${BOOTSTRAP_EMAIL}
      Bootstrap__Password: ${BOOTSTRAP_PASSWORD}
      Documentation__Enabled: "true"
    ports: ["127.0.0.1:${API_PORT:-8080}:8080"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks: [internal]

  tests:
    profiles: [test]
    build:
      context: .
      target: tests
      network: none
    image: backlog-tests:local
    environment:
      TEST_DATABASE: Host=postgres;Database=backlog_tests;Username=backlog;Password=${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    volumes: ["./artifacts/test-results:/results"]
    networks: [internal]

networks:
  internal:
    internal: true
